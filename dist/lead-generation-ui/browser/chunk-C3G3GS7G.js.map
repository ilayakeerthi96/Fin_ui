<!--sidebar-->
<c-sidebar 
  #sidebar1="cSidebar"
  class="d-print-none sidebar sidebar-fixed border-end"
  colorScheme="dark"
  id="sidebar1"
  visible
>
<c-sidebar-header class="border-bottom d-flex justify-content-center align-items-center">
  <c-sidebar-brand [routerLink]="[]">
    <img src="assets/images/ITTI-Logo.png" 
         alt="Company Logo" 
         style="height: 50px;" />
  </c-sidebar-brand>
</c-sidebar-header>

  <!-- <ng-scrollbar pointerEventsMethod="scrollbar" visibility="hover">
    <c-sidebar-nav [navItems]="navItems" dropdownMode="none" compact />
  </ng-scrollbar> -->
  <ng-scrollbar pointerEventsMethod="scrollbar" visibility="hover">
  <c-sidebar-nav 
    [navItems]="navItemsFiltered()" 
    dropdownMode="none" 
    compact 
  />
</ng-scrollbar>


  <!-- @if (!sidebar1.narrow) {
    <c-sidebar-footer cSidebarToggle="sidebar1" class="border-top d-none d-lg-flex" toggle="unfoldable" style="cursor: pointer;">
      <button cSidebarToggler aria-label="Toggle sidebar fold"></button>
    </c-sidebar-footer>
  } -->
</c-sidebar>

<!--main-->
<div class="wrapper d-flex flex-column min-vh-100">
  <!--app-header-->
  <app-default-header
    [cShadowOnScroll]="'sm'"
    class="mb-4 d-print-none header header-sticky p-0 shadow-sm"
    position="sticky"
    sidebarId="sidebar1"
  />
  <!--app-body-->
  <div class="body flex-grow-1">
    <c-container breakpoint="lg" class="h-auto px-4">
      <router-outlet />
    </c-container>
  </div>
  <!--app footer-->
  <app-default-footer />
</div>

<!-- Report Assistant — floating, every page, outside router-outlet so it survives navigation -->
<app-report-chat-widget />
