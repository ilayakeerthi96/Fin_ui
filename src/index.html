<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="./">
  <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport" />
  <meta content="Onboarding App" name="description" />

    content="CoreUI,Bootstrap,Admin,Template,Free,Angular,Dashboard,Typescript"
    name="keyword"

  <title>Lead Tracking App</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Suppress Google Website Translator's own top banner/toolbar - defined
       here (not just in the compiled app stylesheet) so it is guaranteed to
       be present the instant Google's script tries to inject that banner. -->
  <style>
    .goog-te-banner-frame,
    .goog-te-banner-frame.skiptranslate,
    #goog-gt-tt,
    .goog-te-balloon-frame,
    .goog-tooltip,
    .goog-tooltip:hover,
    .goog-text-highlight {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
    }
    body {
      top: 0px !important;
      position: static !important;
    }
  </style>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<app-root>
  <div class="fade show" style="text-align: center; padding-top: calc(100vh / 2); height: 100vh">
    <i class="spinner-grow spinner-grow-sm"></i>
    <span class="m-1">Loading...</span>
  </div>
</app-root>

<!-- Whole-app automatic translation (Google Website Translator). Kept hidden -
     the language dropdown in the header drives it programmatically instead of
     showing Google's own toolbar/UI. -->
<div id="google_translate_element" style="position:absolute; top:-9999px; left:-9999px; width:1px; height:1px; overflow:hidden;"></div>
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'en,es,fr,de,ar,zh-CN',
      autoDisplay: false
    }, 'google_translate_element');
  }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
<script type="text/javascript">
  // Belt-and-suspenders: Google's script re-applies an inline top-offset to
  // <body> and injects its banner iframe fresh each time a language is
  // picked, so keep neutralizing both instead of relying on CSS alone.
  (function () {
    function stripGoogleBanner() {
      if (document.body && document.body.style.top && document.body.style.top !== '0px') {
        document.body.style.top = '0px';
      }
      document.querySelectorAll('.goog-te-banner-frame').forEach(function (el) {
        el.style.display = 'none';
      });
    }
    const observer = new MutationObserver(stripGoogleBanner);
    observer.observe(document.documentElement, { attributes: true, childList: true, subtree: true });
    setInterval(stripGoogleBanner, 500);
  })();
</script>
</body>
</html>
