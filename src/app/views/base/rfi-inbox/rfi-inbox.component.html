<c-container class="mt-4" fluid>
  <c-row class="mb-4">
    <c-col xs="12">
      <c-card class="border-0 shadow-lg">
        <div class="rfi-header">
          <c-card-body class="p-4">
            <h3 class="text-white mb-1 fw-bold">
              <i class="bi bi-question-circle me-2"></i>
              Requests for Information
            </h3>
            <p class="text-white mb-0 opacity-90">Buyers asking about your company's capabilities - no pricing needed.</p>
          </c-card-body>
        </div>
      </c-card>
    </c-col>
  </c-row>

  <c-row *ngIf="isLoading">
    <c-col xs="12" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="text-muted mt-3">Loading...</p>
    </c-col>
  </c-row>

  <c-row *ngIf="!isLoading && rows.length === 0">
    <c-col xs="12">
      <c-card class="border-0 shadow-sm">
        <c-card-body class="text-center py-5">
          <p class="text-muted mb-0">No RFIs at the moment.</p>
        </c-card-body>
      </c-card>
    </c-col>
  </c-row>

  <c-row *ngFor="let row of rows" class="mb-3">
    <c-col xs="12">
      <c-card class="border-0 shadow-sm">
        <c-card-body class="d-flex justify-content-between align-items-center flex-wrap gap-3">
          <div>
            <div class="d-flex align-items-center gap-2 mb-1">
              <strong>{{ row.rfi.title }}</strong>
              <c-badge [color]="row.hasResponded ? 'success' : 'warning'">
                {{ row.hasResponded ? 'Responded' : 'Awaiting Your Response' }}
              </c-badge>
              <c-badge *ngIf="row.rfi.status === 'CLOSED'" color="secondary">Closed</c-badge>
            </div>
            <div class="text-muted small">
              {{ row.rfi.description }}
              <span *ngIf="row.rfi.dueDate"> &middot; Due {{ row.rfi.dueDate }}</span>
            </div>
          </div>
          <button cButton color="primary" size="sm" (click)="respond(row.rfi.id)">
            {{ row.hasResponded ? 'View / Edit Response' : 'Respond' }}
          </button>
        </c-card-body>
      </c-card>
    </c-col>
  </c-row>
</c-container>
