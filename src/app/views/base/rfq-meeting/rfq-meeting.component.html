<!-- ============================================================
     RFQ Video Meeting Modal
     Full-screen overlay with Jitsi Meet embedded
============================================================ -->

<div class="meeting-overlay">

  <!-- ── Meeting header bar ── -->
  <div class="meeting-header">
    <div class="meeting-header-left">
      <div class="meeting-icon-wrap">
        <i class="bi bi-camera-video-fill"></i>
      </div>
      <div>
        <div class="meeting-title">Video Meeting</div>
        <div class="meeting-subtitle" *ngIf="rfqNumber">RFQ: {{ rfqNumber }}</div>
      </div>
    </div>
    <div class="meeting-header-right">
      <a [href]="meetingLink" target="_blank" class="meeting-link-btn" title="Open in new tab">
        <i class="bi bi-box-arrow-up-right me-1"></i>Open in new tab
      </a>
      <button class="meeting-close-btn" (click)="close()" title="Leave meeting">
        <i class="bi bi-telephone-x-fill me-1"></i>Leave
      </button>
    </div>
  </div>

  <!-- ── Loading state ── -->
  <div *ngIf="isLoading && !loadError" class="meeting-loading">
    <div class="meeting-loading-inner">
      <div class="meeting-loader-ring"></div>
      <div class="meeting-loading-icon">
        <i class="bi bi-camera-video-fill"></i>
      </div>
      <h5 class="mt-4 fw-semibold">Connecting to meeting…</h5>
      <p class="text-muted mt-1" style="font-size:0.88rem;">Please allow camera and microphone access when prompted.</p>
    </div>
  </div>

  <!-- ── Error state ── -->
  <div *ngIf="loadError" class="meeting-loading">
    <div class="meeting-loading-inner">
      <div class="meeting-error-icon"><i class="bi bi-wifi-off"></i></div>
      <h5 class="mt-4 fw-semibold text-danger">Could not load meeting</h5>
      <p class="text-muted mt-1" style="font-size:0.88rem;">Check your internet connection, then try again.</p>
      <a [href]="meetingLink" target="_blank" class="btn btn-primary btn-sm mt-3">
        <i class="bi bi-box-arrow-up-right me-1"></i>Open in browser instead
      </a>
      <button class="btn btn-outline-secondary btn-sm mt-2" (click)="close()">Cancel</button>
    </div>
  </div>

  <!-- ── Jitsi container ── -->
  <div class="jitsi-wrap" [class.hidden]="loadError">
    <div #jitsiContainer class="jitsi-container"></div>
  </div>

</div>
